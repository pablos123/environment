font_family      ZedMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0
disable_ligatures always
include themes/Vague.conf
background_opacity 1.0

scrollback_lines 10000
scrollback_pager nvim --cmd 'set eventignore=FileType' + 'nnoremap q ZQ' + 'call nvim_open_term(0, {})' + 'set nomodified nolist' + '$' -


#################################
# Performance / Rendering
#################################
enable_audio_bell no
sync_to_monitor yes
repaint_delay 8
input_delay 1

#################################
# Cursor
#################################
cursor_shape block
cursor_blink_interval 0

#################################
# Tabs (optional sane defaults)
#################################
tab_bar_edge bottom
tab_bar_style separator
tab_separator " |"

#################################
# Ctrl+Shift keybindings for tabs
#################################
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab

map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab

# Reorder: kitty's own defaults, kept explicit for discoverability
map ctrl+shift+, move_tab_backward
map ctrl+shift+. move_tab_forward

map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+0 goto_tab 10

#################################
# Scrollback
#################################
# Moved off ctrl+shift+h, which now switches tabs
map ctrl+shift+; show_scrollback
