font_family      ZedMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0
disable_ligatures always
include themes/Vague.conf
background_opacity 1.0

scrollback_lines 10000
scrollback_pager nvim --cmd 'set eventignore=FileType' + 'nnoremap q ZQ' + 'call nvim_open_term(0, {})' + 'set nomodified nolist' + '$' -


#################################
# Performance / Rendering
#################################
enable_audio_bell no
sync_to_monitor yes
repaint_delay 8
input_delay 1

#################################
# Cursor
#################################
cursor_shape block
cursor_blink_interval 0

#################################
# Tabs (optional sane defaults)
#################################
tab_bar_edge bottom
tab_bar_style separator
tab_separator " |"

#################################
# Alt keybindings for tabs
#################################
map alt+t new_tab
map alt+q close_tab

map alt+h previous_tab
map alt+l next_tab
map alt+left previous_tab
map alt+right next_tab

map alt+shift+h move_tab_backward
map alt+shift+l move_tab_forward
map alt+shift+left move_tab_backward
map alt+shift+right move_tab_forward

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

#################################
# Ctrl keybindings for tabs
#################################
map ctrl+t new_tab
map ctrl+q close_tab

map ctrl+left previous_tab
map ctrl+right next_tab

map ctrl+shift+left move_tab_backward
map ctrl+shift+right move_tab_forward

map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+0 goto_tab 10
